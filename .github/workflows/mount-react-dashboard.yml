name: Mount React Dashboard

on:
  push:
    branches: [main]
    paths:
      - scripts/mount-react-dashboard.cjs

permissions:
  contents: write

jobs:
  mount:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Apply dashboard mount
        run: node scripts/mount-react-dashboard.cjs
      - name: Validate server syntax
        run: node --check src/server.js
      - name: Commit mounted dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.js public/sales-demo.css render.yaml portal-react/src/pages/Inbox.jsx
          if git diff --cached --quiet; then
            echo "No mount changes needed."
          else
            git commit -m "Finish React portal live-session adapter"
            git push
          fi
