name: Demo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run regression tests
        run: npm test
      - name: Check JavaScript syntax
        run: |
          node --check src/server.js
          node --check src/demoState.js
          node --check src/aiService.js
          node --check src/sharedState.js
          node --check public/app.js
          node --check public/portal-data.js
          node --check public/portal-demo.js
          node --check public/portal-fidelity.js
          node --check playwright.config.js
          node --check e2e/demo.spec.js
      - name: Run browser E2E tests
        run: npm run test:e2e
