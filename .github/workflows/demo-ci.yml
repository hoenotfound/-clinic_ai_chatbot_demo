name: Demo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run regression tests
        run: npm test
      - name: Check JavaScript syntax
        run: |
          node --check src/server.js
          node --check src/demoState.js
          node --check src/aiService.js
          node --check public/app.js
          node --check public/portal-data.js
          node --check public/portal-demo.js
          node --check public/portal-fidelity.js
