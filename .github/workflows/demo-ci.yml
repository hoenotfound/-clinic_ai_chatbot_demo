name: Demo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install dependencies and build React dashboard
        run: npm ci
      - name: Verify React dashboard build exists
        run: test -f portal-react/dist/index.html
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run regression tests
        run: npm test
      - name: Check JavaScript syntax
        run: |
          node --check src/server.js
          node --check src/demoState.js
          node --check src/aiService.js
          node --check src/sharedState.js
          node --check src/opsStats.js
          node --check public/app.js
          node --check public/funnel-telemetry.js
          node --check public/ops.js
          node --check public/subpath-bootstrap.js
          node --check netlify/functions/render-proxy.mjs
          node --check playwright.config.js
          node --check e2e/demo.spec.js
          node --check e2e/dashboard-ux.spec.js
          node --check e2e/public-visual.spec.js
          node --check e2e/subpath.spec.js
      - name: Run browser E2E tests
        run: npm run test:e2e
      - name: Upload public demo visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-demo-visual-qa
          path: visual-artifacts/*.png
          if-no-files-found: ignore