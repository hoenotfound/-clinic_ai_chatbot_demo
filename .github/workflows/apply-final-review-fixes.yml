name: Apply Final Review Fixes

on:
  push:
    branches: [main]
    paths:
      - .apply-final-review-fixes

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Apply reviewed fixes
        run: node scripts/apply-final-review-fixes.js
      - name: Generate deterministic lockfile
        run: npm install --package-lock-only
      - name: Install from lockfile
        run: npm ci
      - name: Run regression tests
        run: npm test
      - name: Check changed JavaScript syntax
        run: |
          node --check src/server.js
          node --check src/demoState.js
          node --check src/aiService.js
          node --check src/sharedState.js
          node --check public/app.js
          node --check public/portal-demo.js
          node --check public/portal-fidelity.js
          node --check e2e/demo.spec.js
      - name: Commit generated fixes
        run: |
          git config user.name "hoenotfound"
          git config user.email "91048208+hoenotfound@users.noreply.github.com"
          git add .
          git commit -m "Apply final demo review fixes"
          git push origin main
