<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 820" role="img" aria-labelledby="title desc">
  <title id="title">AI receptionist conversation and lead qualification preview</title>
  <desc id="desc">A stylised clinic chat interface with an AI reply, booking intent, and a qualified lead card.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1730"/>
      <stop offset="0.62" stop-color="#173b86"/>
      <stop offset="1" stop-color="#2f67e8"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf4ff"/>
      <stop offset="1" stop-color="#dfeaff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#071126" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#fff" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="720" height="820" rx="58" fill="url(#bg)"/>
  <rect width="720" height="820" rx="58" fill="url(#dots)"/>
  <circle cx="616" cy="126" r="152" fill="#6da1ff" opacity="0.2" filter="url(#soft)"/>
  <circle cx="112" cy="692" r="140" fill="#7be6c3" opacity="0.12" filter="url(#soft)"/>
  <g filter="url(#shadow)">
    <rect x="68" y="84" width="496" height="590" rx="34" fill="#fff"/>
    <rect x="68" y="84" width="496" height="82" rx="34" fill="#f8fbff"/>
    <rect x="68" y="132" width="496" height="34" fill="#f8fbff"/>
    <circle cx="116" cy="125" r="19" fill="#2f67e8"/>
    <text x="116" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#fff">N</text>
    <text x="148" y="121" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0d1730">Nova Demo Clinic</text>
    <circle cx="150" cy="142" r="4" fill="#55d6af"/>
    <text x="162" y="146" font-family="Arial, sans-serif" font-size="11" fill="#7d8aa3">AI receptionist online</text>
    <line x1="68" y1="166" x2="564" y2="166" stroke="#e9eef7"/>
    <rect x="104" y="204" width="264" height="78" rx="20" fill="#f2f5f9"/>
    <text x="127" y="235" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#17213a">Hi, how much is HIFU?</text>
    <text x="127" y="260" font-family="Arial, sans-serif" font-size="11" fill="#8a96aa">11:42 AM</text>
    <rect x="198" y="306" width="326" height="132" rx="22" fill="url(#bubble)"/>
    <text x="222" y="338" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1b4fc1">AI RECEPTIONIST</text>
    <text x="222" y="368" font-family="Arial, sans-serif" font-size="14" fill="#17213a">HIFU starts from RM888 ✨</text>
    <text x="222" y="393" font-family="Arial, sans-serif" font-size="14" fill="#17213a">Would you like KL or PJ branch?</text>
    <text x="222" y="418" font-family="Arial, sans-serif" font-size="11" fill="#7d8aa3">11:42 AM</text>
    <rect x="104" y="462" width="304" height="82" rx="20" fill="#2f67e8"/>
    <text x="128" y="494" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">KL. Can I come this Saturday?</text>
    <text x="128" y="520" font-family="Arial, sans-serif" font-size="11" fill="#dbe7ff">11:43 AM</text>
    <rect x="104" y="578" width="164" height="46" rx="23" fill="#eef4ff"/>
    <circle cx="130" cy="601" r="7" fill="#55d6af"/>
    <text x="148" y="606" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#244c9b">Intent detected</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="430" y="486" width="244" height="244" rx="28" fill="#fff"/>
    <rect x="452" y="508" width="90" height="30" rx="15" fill="#e9f8f2"/>
    <circle cx="470" cy="523" r="5" fill="#34bd87"/>
    <text x="483" y="528" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#258763">HOT LEAD</text>
    <text x="452" y="574" font-family="Arial, sans-serif" font-size="13" fill="#8995aa">TREATMENT</text>
    <text x="452" y="597" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0d1730">HIFU</text>
    <text x="452" y="630" font-family="Arial, sans-serif" font-size="13" fill="#8995aa">APPOINTMENT</text>
    <text x="452" y="653" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0d1730">Saturday · KL</text>
    <line x1="452" y1="676" x2="652" y2="676" stroke="#edf1f7"/>
    <circle cx="466" cy="701" r="8" fill="#2f67e8"/>
    <text x="486" y="706" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#2f67e8">Ready for staff</text>
  </g>
  <g transform="translate(92 694)">
    <rect width="284" height="62" rx="31" fill="#0d1730" opacity="0.92"/>
    <circle cx="32" cy="31" r="18" fill="#2f67e8"/>
    <path d="M24 31h16M32 23v16" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="60" y="27" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#9fb1d5">LIVE PRODUCT FLOW</text>
    <text x="60" y="45" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">Message → qualify → handoff</text>
  </g>
</svg>