[build]
  command = "npm run build:netlify"
  publish = "netlify-dist"

# Keep Netlify focused on the production branch. Pull-request previews and
# non-production branch deploys exit before dependency installation/build work,
# which avoids spending the legacy free-tier build-minute allowance on them.
[context.deploy-preview]
  ignore = "exit 0"

[context.branch-deploy]
  ignore = "exit 0"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/ai-chatbot/*"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/ai-chatbot/dashboard/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
